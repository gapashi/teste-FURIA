<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Cadastrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
    rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    
    <!--MAIN CONTAINER-->
    <main class="container my-5">
        <div class="square container-fluid rounded position-relative">
          <div class="row align-items-center">
      
            <div class="col-md-6">
              <div id="login-form">
                <h6 class="login-title">LOGIN</h6>
                <form class="col-md-10">
                  <div class="mb-3">
                    <input type="email" class="form-control" placeholder="e-mail">
                  </div>
                  <div class="mb-3">
                    <input type="password" class="form-control" placeholder="senha">
                  </div>
                  <a href="../feed/feed.html" class="btn btn-dark mb-2 ms-2">Entrar</a>
                </form>
                <a href="#" class="link-dark link-opacity-75-hover ms-2">Esqueceu a senha?</a>
              </div>

              <div id="right-info" class="d-none info-login-box">
                <span>JÁ POSSUI UMA CONTA? FAÇA LOGIN</span>
              </div>
            </div>
      
            <div class="col-md-6 text-end">
              <div id="left-info" class="info-signup-box">
                <span>AINDA NÃO POSSUI UMA CONTA? CADASTRE-SE</span>
              </div>
      
              <!-- FORM CADASTRO -->
              <div id="signup-form" class="d-none">
                <h6 class="sign-up-title">CADASTRO</h6>
                <form class="ms-5 me-0">
                  <div class="mb-3">
                    <input type="text" class="form-control" placeholder="nome de usuário">
                  </div>
                  <div class="mb-3">
                    <input type="email" class="form-control" placeholder="e-mail">
                  </div>
                  <div class="mb-3">
                    <input type="date" class="form-control" placeholder="data de nascimento">
                  </div>
                  <div class="mb-3">
                    <input type="password" class="form-control" placeholder="senha">
                  </div>
                  <div class="mb-3">
                    <input type="password" class="form-control" placeholder="confirmar senha">
                  </div>
                  <button type="submit" class="btn btn-dark mb-2 me-2">Cadastrar</button>
                </form>
              </div>
            </div>
      
            <button id="toggle-button" class="btn btn-dark rounded-circle position-absolute top-50 start-50 translate-middle">
              <span id="arrow-icon">►</span>
            </button>
      
          </div>
        </div>
    </main>
         
</body>

<script>
    const loginForm = document.getElementById("login-form");
    const signupForm = document.getElementById("signup-form");
    const leftInfo = document.getElementById("left-info");
    const rightInfo = document.getElementById("right-info");
    const toggleButton = document.getElementById("toggle-button");
    const arrowIcon = document.getElementById("arrow-icon");

    toggleButton.addEventListener("click", () => {
        const showingLogin = !loginForm.classList.contains("d-none");

        if (showingLogin) {
            // Mostra o cadastro e a mensagem da direita
            loginForm.classList.add("d-none");
            signupForm.classList.remove("d-none");

            leftInfo.classList.add("d-none");
            leftInfo.classList.remove("d-flex");

            rightInfo.classList.remove("d-none");
            rightInfo.classList.add("d-flex");

            arrowIcon.innerHTML = "◄";
        } else {
            // Mostra o login e a mensagem da esquerda
            signupForm.classList.add("d-none");
            loginForm.classList.remove("d-none");

            rightInfo.classList.add("d-none");
            rightInfo.classList.remove("d-flex");

            leftInfo.classList.remove("d-none");
            leftInfo.classList.add("d-flex");

            arrowIcon.innerHTML = "►";
        }

    });
</script>


</html>
